<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control General de Pronósticos</title>
    <style>
        :root {
            --navy: #002147;
            --success: #27ae60;
            --light: #f8f9fa;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #e9ecef;
            margin: 0;
            padding: 20px;
            user-select: none;
        }

        .container {
            max-width: 1450px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid var(--navy);
            margin-bottom: 20px;
            padding-bottom: 10px;
        }

        .header-title h1 { 
            margin: 0; 
            color: var(--navy); 
            font-size: 1.6rem; 
            text-transform: uppercase;
        }

        .toolbar {
            background: var(--light);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .no-print-controls { display: flex; gap: 10px; align-items: center; }

        input, select, button {
            padding: 8px 12px;
            border: 1px solid #ced4da;
            border-radius: 4px;
            font-weight: bold;
        }

        button { cursor: pointer; transition: 0.2s; }
        .btn-print { background: #343a40; color: white; }
        .btn-save { background: var(--success); color: white; }
        .btn-load { background: #7f8c8d; color: white; }

        .table-container { width: 100%; overflow-x: auto; }

        table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
            font-size: 0.7rem;
        }

        th, td { border: 1px solid #000; text-align: center; height: 35px; }
        th { background: #f1f1f1; color: #000; font-weight: bold; }

        .col-nombre { width: 180px; text-align: left; padding-left: 5px; font-weight: 900; background: #fff; }
        .col-dia { width: auto; cursor: pointer; }
        .col-total { width: 45px; background: #f8f9fa; font-weight: bold; }

        .enviado { background-color: #c8e6c9 !important; color: #1b5e20 !important; font-weight: 900; }
        .enviado::after { content: "✔"; }

        .footer-stats {
            display: flex;
            justify-content: flex-end;
            gap: 20px;
            margin-top: 20px;
        }

        .stat-card {
            border: 2px solid var(--navy);
            padding: 10px 20px;
            border-radius: 5px;
            text-align: center;
        }

        .stat-card b { display: block; font-size: 1.4rem; color: var(--navy); }

        @media print {
            @page { size: letter landscape; margin: 0.5cm; }
            body { background: white !important; padding: 0 !important; }
            .container { width: 100% !important; max-width: 100% !important; border: none !important; box-shadow: none !important; padding: 0 !important; }
            .toolbar, .no-print, button, .no-print-controls { display: none !important; }
            header { border-bottom: 2px solid #000 !important; }
            h1 { font-size: 1.4rem !important; color: #000 !important; }
            table { font-size: 0.55rem !important; width: 100% !important; border: 1px solid #000 !important; }
            th, td { border: 0.5pt solid #000 !important; height: 25px !important; }
            .col-nombre { width: 130px !important; font-size: 0.6rem !important; }
            .enviado { background-color: #eee !important; -webkit-print-color-adjust: exact; color-adjust: exact; }
            .stat-card { border: 1px solid #000 !important; }
        }
    </style>
</head>
<body onmouseup="isMouseDown=false">

<div class="container">
    <header>
        <div class="header-title">
            <h1 id="tituloPagina">CONTROL GENERAL DE PRONOSTICOS</h1>
            <small>Centro Zonal de Meteorología Marina Puerto Montt</small>
        </div>
        <div class="no-print-controls no-print">
            <label>AÑO:</label>
            <select id="anioSelect" onchange="cargarAnio()"></select>
            <label>MES:</label>
            <select id="mesSelect" onchange="renderizar()"></select>
        </div>
    </header>

    <div class="toolbar no-print">
        <div class="no-print-controls">
            <input type="text" id="nombreInput" placeholder="Nuevo Sector...">
            <select id="freqInput">
                <option value="2">2 v/día</option>
                <option value="4" selected>4 v/día</option>
            </select>
            <button onclick="agregarItem()" style="background:var(--navy); color:white;">+ AGREGAR</button>
        </div>

        <div class="no-print-controls">
            <button class="btn-save" onclick="exportarJSON()" title="Guardar respaldo de todos los años">💾 RESPALDO</button>
            <button class="btn-load" onclick="document.getElementById('fileIn').click()" title="Restaurar datos">📂 CARGAR</button>
            <input type="file" id="fileIn" style="display:none" onchange="importarJSON(event)">
            <button class="btn-print" onclick="window.print()">🖨️ GENERAR PDF</button>
        </div>
    </div>

    <div class="table-container">
        <table id="tablaPrincipal">
            <thead><tr id="headDias"></tr></thead>
            <tbody id="cuerpoTabla"></tbody>
        </table>
    </div>

    <div class="footer-stats">
        <div class="stat-card">ENVÍOS MES <b id="totalMes">0</b></div>
        <div class="stat-card">TOTAL ACUMULADO <b id="totalAnual">0</b></div>
    </div>
</div>

<script>
    // TU ENLACE OFICIAL DE CLOUDFLARE PARA PRONOSTICOS
    const WORKER_URL = "https://api-pronosticos.salaspancho16.workers.dev";
    
    let isMouseDown = false;
    let dbGlobal = {}; // Contenedor global para guardar todos los años juntos en la nube
    let db = []; // Referencia visual al año seleccionado

    const PRONOSTICOS_BASE = [
        { nombre: "CHILOE ORIENTAL PM", freq: 2 },
        { nombre: "CANAL CHACAO", freq: 4 },
        { nombre: "BAHÍA PTO MONTT", freq: 4 },
        { nombre: "BAHÍA MAULLIN", freq: 4 },
        { nombre: "BAHIA PTO CHACABUCO", freq: 4 },
        { nombre: "ISLA GUAFO", freq: 4 },
        { nombre: "GOLFO DE PENAS", freq: 4 },
        { nombre: "QUELLÓN - MELINKA PM", freq: 2 },
        { nombre: "CHILOE ORIENTAL AM", freq: 2 },
        { nombre: "BALLESTA", freq: 2 },
        { nombre: "QUELLÓN - MELINKA AM", freq: 2 }
    ];

    const mesesNombres = ["ENERO", "FEBRERO", "MARZO", "ABRIL", "MAYO", "JUNIO", "JULIO", "AGOSTO", "SEPTIEMBRE", "OCTUBRE", "NOVIEMBRE", "DICIEMBRE"];
    const hoy = new Date();

    window.onload = async () => {
        const aSel = document.getElementById("anioSelect");
        for(let a=2020; a<=2035; a++) aSel.add(new Option(a, a));
        aSel.value = hoy.getFullYear();

        const mSel = document.getElementById("mesSelect");
        mesesNombres.forEach((m, i) => mSel.add(new Option(m, i)));
        mSel.value = hoy.getMonth();

        // 1. Cargar datos de la nube
        await cargarDesdeNube();
        // 2. Procesar el año en pantalla
        cargarAnio();
    };

    async function cargarDesdeNube() {
        try {
            const respuesta = await fetch(WORKER_URL);
            dbGlobal = await respuesta.json();
        } catch (error) {
            console.error("Error conectando con la base de datos:", error);
            dbGlobal = {};
        }
    }

    function cargarAnio() {
        const anio = document.getElementById("anioSelect").value;
        if(dbGlobal[anio]) {
            db = dbGlobal[anio];
        } else {
            // Si el año es nuevo, lo creamos desde cero y lo metemos en la base
            db = PRONOSTICOS_BASE.map(p => ({ nombre: p.nombre, frecuencia: p.freq, marcas: {} }));
            dbGlobal[anio] = db;
        }
        renderizar();
    }

    function toggleDia(pIdx, dia) {
        const mes = document.getElementById("mesSelect").value;
        const key = mes + "-" + dia;
        if(db[pIdx].marcas[key]) delete db[pIdx].marcas[key];
        else db[pIdx].marcas[key] = db[pIdx].frecuencia;
        salvar();
    }

    function marcarFilaCompleta(pIdx) {
        const mes = document.getElementById("mesSelect").value;
        const anio = document.getElementById("anioSelect").value;
        const diasEnMes = new Date(anio, parseInt(mes) + 1, 0).getDate();
        let tieneMarcas = false;
        for(let d=1; d<=diasEnMes; d++) if(db[pIdx].marcas[mes + "-" + d]) { tieneMarcas = true; break; }
        for(let d=1; d<=diasEnMes; d++) {
            const key = mes + "-" + d;
            if(tieneMarcas) delete db[pIdx].marcas[key];
            else db[pIdx].marcas[key] = db[pIdx].frecuencia;
        }
        salvar();
    }

    function salvar() {
        const anio = document.getElementById("anioSelect").value;
        dbGlobal[anio] = db;
        
        // Sincronización silenciosa con Cloudflare
        fetch(WORKER_URL, {
            method: 'POST',
            body: JSON.stringify(dbGlobal)
        }).catch(err => console.error("Error al guardar en la nube:", err));
        
        renderizar();
    }

    function renderizar() {
        const anio = document.getElementById("anioSelect").value;
        const mesIdx = parseInt(document.getElementById("mesSelect").value);
        document.getElementById("tituloPagina").innerText = `CONTROL GENERAL DE PRONOSTICOS AÑO ${anio}`;
        const diasEnMes = new Date(anio, mesIdx + 1, 0).getDate();
        
        let hHtml = '<th class="col-nombre">PRONÓSTICO</th>';
        for(let d=1; d<=diasEnMes; d++) hHtml += `<th class="col-dia">${d}</th>`;
        hHtml += '<th class="col-total">TOT</th><th class="no-print" style="width:30px">✕</th>';
        document.getElementById("headDias").innerHTML = hHtml;

        const tbody = document.getElementById("cuerpoTabla");
        tbody.innerHTML = "";
        let sumaMes = 0; let sumaAnual = 0;

        db.forEach((p, pIdx) => {
            const tr = document.createElement("tr");
            let totalFilaMes = 0; let totalFilaAnual = 0;
            Object.keys(p.marcas).forEach(key => {
                totalFilaAnual += p.marcas[key];
                if(key.startsWith(mesIdx + "-")) totalFilaMes += p.marcas[key];
            });
            sumaMes += totalFilaMes; sumaAnual += totalFilaAnual;

            let bHtml = `<td class="col-nombre" ondblclick="marcarFilaCompleta(${pIdx})">${p.nombre}<br><small>Frec: ${p.frecuencia}</small></td>`;
            for(let d=1; d<=diasEnMes; d++) {
                const key = mesIdx + "-" + d;
                const activo = p.marcas[key] ? 'enviado' : '';
                bHtml += `<td class="col-dia ${activo}" onmousedown="isMouseDown=true; toggleDia(${pIdx}, ${d})" onmouseover="if(isMouseDown) toggleDia(${pIdx}, ${d})"></td>`;
            }
            tr.innerHTML = bHtml + `<td class="col-total">${totalFilaMes}</td><td class="no-print"><button onclick="eliminarFila(${pIdx})" style="border:none; background:none; cursor:pointer;">❌</button></td>`;
            tbody.appendChild(tr);
        });

        document.getElementById("totalMes").innerText = sumaMes;
        document.getElementById("totalAnual").innerText = sumaAnual;
    }

    function agregarItem() {
        const nombre = document.getElementById("nombreInput").value.trim().toUpperCase();
        const freq = parseInt(document.getElementById("freqInput").value);
        if(!nombre) return;
        db.push({ nombre, frecuencia: freq, marcas: {} });
        document.getElementById("nombreInput").value = "";
        salvar();
    }

    function eliminarFila(idx) { if(confirm("¿Eliminar sector?")) { db.splice(idx, 1); salvar(); } }
    
    function exportarJSON() {
        // Ahora exporta TODA la base de datos, no solo un año
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(dbGlobal));
        const a = document.createElement('a');
        a.href = dataStr; a.download = `Control_Pronosticos_Global_Nube.json`; a.click();
    }

    function importarJSON(e) {
        const reader = new FileReader();
        reader.onload = (ev) => { 
            try { 
                const dataCargada = JSON.parse(ev.target.result);
                // Si el archivo es antiguo (un array), lo guarda en el año seleccionado
                if(Array.isArray(dataCargada)) {
                    const anio = document.getElementById("anioSelect").value;
                    dbGlobal[anio] = dataCargada;
                } else {
                    // Si es el nuevo respaldo global, reemplaza todo
                    dbGlobal = dataCargada;
                }
                cargarAnio();
                salvar(); 
            } catch(err) { alert("Archivo no válido"); } 
        };
        reader.readAsText(e.target.files[0]);
    }
</script>
</body>
</html>
